[build]
  publish = "marilo-netlify"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA - todo lo que no sea archivo va a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
